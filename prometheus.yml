global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: "backend"
    static_configs:
      - targets: ["backend:8000"]
  - job_name: "consumer"
    scrape_interval: 5s
    static_configs:
      - targets: ["consumer:8001"]
  - job_name: "collector"
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:8002"]
