services:

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: erroruser
      POSTGRES_PASSWORD: errorpassword
      POSTGRES_DB: errordb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    restart: always
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: errordb
      DB_USER: erroruser
      DB_PASSWORD: errorpassword

volumes:
  pgdata: